
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess The Number</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
  background: linear-gradient(135deg, #0f172a, #1e3a5f, #312e81);
  background-size: 200% 200%;
  animation: backgroundMove 8s ease infinite;
  color: white;
  font-family: Arial, sans-serif;
}

.game {
  width: 100%;
  max-width: 410px;
  padding: 28px;
  border-radius: 24px;
  background: rgba(30, 41, 59, 0.95);
  box-shadow: 0 20px 50px #0006;
  text-align: center;
  animation: appear 0.6s ease;
}

h1 {
  margin-top: 0;
  font-size: 28px;
}

p {
  color: #cbd5e1;
  line-height: 1.5;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 20px 0;
}

.stat {
  padding: 13px 8px;
  background: #334155;
  border-radius: 13px;
}

.stat strong {
  display: block;
  margin-top: 6px;
  color: #38bdf8;
  font-size: 20px;
}

select, input, button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 11px;
  font-size: 16px;
}

select, input {
  background: #334155;
  color: white;
}

button {
  background: #38bdf8;
  color: #082f49;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
}

button:hover {
  background: #7dd3fc;
  transform: translateY(-2px);
}

button:active {
  transform: scale(0.98);
}

.secondary {
  background: #475569;
  color: white;
}

#message {
  min-height: 30px;
  margin-top: 20px;
  font-weight: bold;
}

#playing[hidden] {
  display: none;
}

#playing {
  animation: appear 0.4s ease;
}

.footer {
  margin-top: 20px;
  font-size: 12px;
  color: #94a3b8;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes backgroundMove {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@media (max-width: 400px) {
  .game {
    padding: 20px;
  }

  h1 {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<div class="game">

  <h1>🎯 Guess The Number</h1>
  <p>Can you guess the secret number?</p>

  <div class="stats">
    <div class="stat">
      🏆 High Score
      <strong id="highScore">0</strong>
    </div>

    <div class="stat">
      ⏱️ Time
      <strong id="timer">0s</strong>
    </div>
  </div>

  <div id="startScreen">
    <p>Choose your difficulty:</p>

    <select id="difficulty">
      <option value="10">Easy (1–10)</option>
      <option value="50">Medium (1–50)</option>
      <option value="100">Hard (1–100)</option>
    </select>

    <button id="startBtn">Start Game</button>
  </div>

  <div id="playing" hidden>
    <p id="info"></p>

    <input
      id="guess"
      type="number"
      placeholder="Enter your guess"
      min="1"
    >

    <button id="guessBtn">Guess</button>
    <button id="restartBtn" class="secondary">
      Restart Game
    </button>
  </div>

  <h3 id="message">Ready to play?</h3>
  <p id="attempts"></p>

  <div class="footer">
    Made with ❤️ | Guess The Number
  </div>

</div>

<script>
let number;
let attempts;
let maxAttempts;
let maxNumber;
let active = false;
let seconds = 0;
let timerInterval = null;

let highScore = Number(
  localStorage.getItem("highScore")
) || 0;

const highScoreElement = document.getElementById("highScore");
const timerElement = document.getElementById("timer");
const messageElement = document.getElementById("message");
const attemptsElement = document.getElementById("attempts");
const guessInput = document.getElementById("guess");

function updateHighScore() {
  highScoreElement.textContent = highScore;
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function startTimer() {
  stopTimer();
  seconds = 0;
  timerElement.textContent = "0s";

  timerInterval = setInterval(() => {
    seconds++;
    timerElement.textContent = seconds + "s";
  }, 1000);
}

function startGame() {
  maxNumber = Number(
    document.getElementById("difficulty").value
  );

  maxAttempts =
    maxNumber === 10 ? 5 :
    maxNumber === 50 ? 7 : 10;

  number = Math.floor(Math.random() * maxNumber) + 1;

  attempts = 0;
  active = true;

  document.getElementById("startScreen").hidden = true;
  document.getElementById("playing").hidden = false;

  document.getElementById("info").textContent =
    `Guess between 1 and ${maxNumber}. You have ${maxAttempts} attempts.`;

  messageElement.textContent = "Good luck! 🍀";
  attemptsElement.textContent = "";

  guessInput.value = "";
  guessInput.max = maxNumber;
  guessInput.focus();

  startTimer();
}

function finishGame(won) {
  active = false;
  stopTimer();

  if (won) {
    const score = Math.max(
      10,
      maxNumber + (maxAttempts - attempts) * 10 - seconds
    );

    messageElement.textContent = `🎉 You Win! Score: ${score}`;

    if (score > highScore) {
      highScore = score;
      localStorage.setItem("highScore", highScore);
      updateHighScore();

      messageElement.textContent =
        `🏆 New High Score! ${score} points`;
    }

  } else {
    messageElement.textContent =
      `Game Over! The number was ${number} 😢`;
  }

  attemptsElement.textContent =
    `Attempts: ${attempts}/${maxAttempts} | Time: ${seconds}s`;
}

function checkGuess() {
  if (!active) return;

  const guess = Number(guessInput.value);

  if (
    guessInput.value.trim() === "" ||
    !Number.isInteger(guess) ||
    guess < 1 ||
    guess > maxNumber
  ) {
    messageElement.textContent =
      "Please enter a valid number!";
    return;
  }

  attempts++;

  if (guess === number) {
    finishGame(true);

  } else if (guess > number) {
    messageElement.textContent = "Too High! ⬇️";

  } else {
    messageElement.textContent = "Too Low! ⬆️";
  }

  if (active && attempts >= maxAttempts) {
    finishGame(false);
  }

  attemptsElement.textContent =
    `Attempts: ${attempts}/${maxAttempts}`;

  guessInput.value = "";
  if (active) guessInput.focus();
}

function restartGame() {
  startGame();
}

document.getElementById("startBtn")
  .addEventListener("click", startGame);

document.getElementById("guessBtn")
  .addEventListener("click", checkGuess);

document.getElementById("restartBtn")
  .addEventListener("click", restartGame);

guessInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    checkGuess();
  }
});

updateHighScore();
</script>

</body>
</html>
